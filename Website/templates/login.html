{% extends 'base.html' %}

{% block title %}Login - Earthquake Management System{% endblock %}

{% block content %}
<div style="margin: 60px auto; max-width: 400px;">
    <h2>Sign In</h2>
    <p style="margin-bottom: 24px;">Enter your credentials to access the system.</p>
    
    <div class="card">
        <form method="POST" action="{{ url_for('login') }}" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label for="email" style="font-weight: 500; font-size: 14px; display: block; margin-bottom: 8px;">Email Address</label>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 8px; font-family: var(--font-ui); background: var(--surface-100);">
            </div>
            
            <div>
                <label for="password" style="font-weight: 500; font-size: 14px; display: block; margin-bottom: 8px;">Password</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid var(--border-medium); border-radius: 8px; font-family: var(--font-ui); background: var(--surface-100);">
            </div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">Login</button>
        </form>
    </div>
    
    <div style="margin-top: 24px; font-size: 14px; text-align: center;">
        <p>Don't have an account? <a href="{{ url_for('signup_user') }}">Register safely.</a></p>
    </div>
    

</div>
{% endblock %}
