{% extends 'base.html' %}
{% block title %}Login - Earthquake Management System{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center; padding: 40px 0;">
  <div style="width: 100%; max-width: 420px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="font-size: 3rem; margin-bottom: 12px;">🔐</div>
      <h2>Sign In</h2>
      <p style="margin-top: 8px;">Access the disaster response platform</p>
    </div>
    <div class="form-card-inner">
      <form method="POST" action="{{ url_for('login') }}" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 4px;">Sign In</button>
      </form>
    </div>
    <p style="text-align: center; margin-top: 24px; font-size: 0.875rem;">
      Don't have an account? <a href="{{ url_for('signup_user') }}">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
