{% extends 'base.html' %}
{% block title %}Sign Up - Earthquake Management System{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center; padding: 40px 0;">
  <div style="width: 100%; max-width: 460px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="font-size: 3rem; margin-bottom: 12px;">👤</div>
      <h2>{{ role }} Registration</h2>
      <p style="margin-top: 8px;">Create an account to track metrics or register as a volunteer.</p>
    </div>
    <div class="form-card-inner">
      <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="Jane Smith">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        {% if role == 'User' %}
        <div class="form-group">
          <label for="region">Region</label>
          <input type="text" id="region" name="region" placeholder="e.g. Central Valley">
        </div>
        {% endif %}
        <button type="submit" class="btn" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 4px;">Create Account</button>
      </form>
    </div>
    <p style="text-align: center; margin-top: 24px; font-size: 0.875rem;">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
