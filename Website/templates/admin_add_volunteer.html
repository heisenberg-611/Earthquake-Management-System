{% extends 'base.html' %}
{% block title %}Add Volunteer - Earthquake Management System{% endblock %}
{% block content %}
<div class="form-card">
  <div class="form-header" style="text-align: center; margin-bottom: 8px;">
    <div style="font-size: 3rem; margin-bottom: 12px;">➕</div>
    <h2>Directly Add Volunteer</h2>
    <p style="margin-top: 8px;">Automatically registers the volunteer onto the User platform and the Volunteer field roster simultaneously.</p>
  </div>
  <div class="form-card-inner">
    <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" required placeholder="Jane Smith">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="volunteer@example.com">
      </div>
      <div class="form-group">
        <label>Region</label>
        <input type="text" name="region" required placeholder="e.g. Eastern Seaboard">
      </div>
      <div class="form-group">
        <label>Skills</label>
        <input type="text" name="skills" required placeholder="e.g. Heavy Machinery, Medical">
      </div>
      <div class="form-footer">
        <button type="submit" class="btn">✅ Register Volunteer</button>
        <a href="{{ url_for('volunteers') }}" class="btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
