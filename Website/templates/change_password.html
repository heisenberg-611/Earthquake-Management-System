{% extends 'base.html' %}
{% block title %}Change Password - Earthquake Management System{% endblock %}
{% block content %}
<div style="min-height: calc(100vh - 150px); display: flex; align-items: center; justify-content: center; padding: 40px 0;">
  <div style="width: 100%; max-width: 420px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="font-size: 3rem; margin-bottom: 12px;">🔑</div>
      <h2>Change Password</h2>
      <p style="margin-top: 8px;">Update your account security credentials</p>
    </div>
    <div class="form-card-inner">
      <form method="POST" action="{{ url_for('change_password') }}" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="form-group">
          <label for="current_password">Current Password</label>
          <input type="password" id="current_password" name="current_password" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="new_password">New Password</label>
          <input type="password" id="new_password" name="new_password" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 4px;">Update Password</button>
      </form>
    </div>
    <p style="text-align: center; margin-top: 24px; font-size: 0.875rem;">
      <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </p>
  </div>
</div>
{% endblock %}
